[pytest]
asyncio_mode = auto
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (database, external services)
    e2e: End-to-end tests
    live: Live tests against real third-party APIs (Halal Terminal, etc.) — skipped in CI; run manually with `pytest -m live -v`
testpaths = tests
pythonpath = .
addopts = -v --tb=short -m "not live"
